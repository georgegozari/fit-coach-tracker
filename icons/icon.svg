<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#0f9488"/>
      <stop offset="1" stop-color="#0b5f58"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- progress ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-opacity="0.22" stroke-width="30"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="706 943" transform="rotate(-90 256 256)"/>
  <!-- downward trend -->
  <polyline points="168,196 228,256 266,224 338,296" fill="none" stroke="#fff" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="272,312 346,312 346,238" fill="none" stroke="#fde68a" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
